[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mockdata"
version = "0.1.0"
description = "Mock data CLI for the NV-centre magnetometer database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mockdb = "mockdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mockdata = ["schema.sql"]
